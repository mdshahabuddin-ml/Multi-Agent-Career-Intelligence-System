# pytest configuration for CareerIntel AI

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end workflow tests
    slow: Slow running tests
    requires_api: Tests requiring external API keys
    security: Security-related tests

# Output
addopts =
    -v
    --strict-markers
    --tb=short
    -ra
    --disable-warnings
    # Coverage
    --cov=backend
    --cov-report=term-missing
    --cov-report=html:tests/coverage/html
    --cov-report=xml:tests/coverage/coverage.xml
    --cov-fail-under=70
    # JUnit XML (flag form; the junitxml ini key was removed in pytest 9)
    --junitxml=tests/coverage/junit.xml
    # Exclude
    --ignore=backend/.venv
    --ignore=frontend/node_modules

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Timeouts
timeout = 60

# Parallel execution (optional)
# numprocesses = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %H:%M:%S

# Test session
session_timeout = 300

# Doctest
doctest_optionflags = NORMALIZE_WHITESPACE

# Custom
# enable plugin: pytest-mock
# enable plugin: pytest-cov
# enable plugin: pytest-asyncio